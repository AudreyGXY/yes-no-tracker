<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf7f3"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Yes or No"><title>Yes or No</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#342f31;background:#faf7f3}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}main{max-width:540px;margin:auto;padding:30px 0}h1{font-size:30px;letter-spacing:-1px;margin:0 0 7px}p{color:#777078;margin:0 0 25px}.card{background:white;border:1px solid #eee7e4;border-radius:22px;padding:20px;margin:16px 0;box-shadow:0 5px 25px #59422a08}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{font:inherit;cursor:pointer;border:0;border-radius:16px;padding:18px;font-weight:700}button.yes{background:#dcefe3;color:#245d42}button.no{background:#f8dddd;color:#8d3c42}button.small{padding:10px 13px;background:#f3efed;color:#51484c;font-size:13px}textarea{width:100%;resize:vertical;border:1px solid #ded6d3;border-radius:12px;padding:13px;font:inherit;min-height:70px;margin:12px 0}label{font-weight:600;font-size:14px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:center}.number{font-size:32px;font-weight:800}.muted{color:#777078;font-size:13px}.entry{padding:14px 0;border-bottom:1px solid #eee8e5;display:flex;justify-content:space-between;gap:12px}.entry:last-child{border:0}.entry .note{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:6px}.tag{font-weight:700}.yesText{color:#368259}.noText{color:#bb555c}.actions{display:flex;gap:8px;flex-wrap:wrap}#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#333;color:white;padding:12px 20px;border-radius:30px;opacity:0;transition:opacity .2s;pointer-events:none}.empty{padding:15px 0;color:#827980;text-align:center}</style></head><body><main><h1>Yes or No? ♡</h1><p>A little record of everyday answers.</p><section class="card"><label for="remarks">What did you ask? <span class="muted">(optional)</span></label><textarea id="remarks" placeholder="Add a note, or leave blank..."></textarea><div class="buttons"><button class="yes" id="yes">✓ Yes</button><button class="no" id="no">✕ No</button></div><p class="muted" style="margin:13px 0 0">Saved with the current date and time on this device.</p></section><section class="card"><h2 style="margin-top:0">The tally</h2><div class="stats"><div><div class="number yesText" id="yesCount">0</div><div class="muted">Yes</div></div><div><div class="number noText" id="noCount">0</div><div class="muted">No</div></div></div><div id="ratio" class="muted" style="text-align:center;margin-top:18px">No answers recorded yet</div></section><section class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2 style="margin:0">History</h2><button class="small" id="export">Export CSV</button></div><div id="history"></div></section><p class="muted">Private to this browser on this device. Export regularly to keep a backup. Clearing browser data may erase entries.</p></main><div id="toast" role="status"></div><script>const KEY='yes-no-tracker-v1';const $=id=>document.getElementById(id);let entries=[];try{entries=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(entries))entries=[]}catch{}function persist(){localStorage.setItem(KEY,JSON.stringify(entries))}function toast(t){$('toast').textContent=t;$('toast').style.opacity='1';setTimeout(()=>$('toast').style.opacity='0',1700)}function add(answer){entries.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),answer,remark:$('remarks').value.trim(),date:new Date().toISOString()});try{persist()}catch{alert('Could not save this entry. Check your browser storage.');return}$('remarks').value='';render();toast(answer+' saved ✓')}function render(){const y=entries.filter(x=>x.answer==='Yes').length,n=entries.filter(x=>x.answer==='No').length;$('yesCount').textContent=y;$('noCount').textContent=n;$('ratio').textContent=entries.length?`${Math.round(y/entries.length*100)}% Yes · ${Math.round(n/entries.length*100)}% No · ${entries.length} total`:'No answers recorded yet';const h=$('history');h.replaceChildren();if(!entries.length){const e=document.createElement('div');e.className='empty';e.textContent='Your entries will appear here.';h.append(e)}entries.forEach(e=>{const row=document.createElement('div');row.className='entry';const info=document.createElement('div');const tag=document.createElement('div');tag.className='tag '+(e.answer==='Yes'?'yesText':'noText');tag.textContent=e.answer;const dt=document.createElement('div');dt.className='muted';dt.textContent=new Date(e.date).toLocaleString();info.append(tag,dt);if(e.remark){const note=document.createElement('div');note.className='note';note.textContent=e.remark;info.append(note)}const del=document.createElement('button');del.className='small';del.textContent='Delete';del.setAttribute('aria-label','Delete entry');del.onclick=()=>{if(confirm('Delete this entry?')){entries=entries.filter(x=>x.id!==e.id);persist();render()}};row.append(info,del);h.append(row)})}function csvEscape(v){return '"'+String(v??'').replaceAll('"','""')+'"'}$('yes').onclick=()=>add('Yes');$('no').onclick=()=>add('No');$('export').onclick=()=>{const csv='\uFEFFDate,Answer,Remarks\r\n'+entries.map(e=>[new Date(e.date).toLocaleString(),e.answer,e.remark].map(csvEscape).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='yes-no-history.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};render();</script></body></html>
